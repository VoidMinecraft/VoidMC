name: Pinned toolchain
description: Installs the toolchain of a rust-toolchain.toml and fails if cargo would use another one.
inputs:
  dir:
    description: Folder whose rust-toolchain.toml is installed and checked.
    required: false
    default: .
  components:
    description: Components to add, comma separated, or empty for none.
    required: false
    default: clippy,rustfmt
runs:
  using: composite
  steps:
    - name: Install the pinned toolchain
      shell: bash
      working-directory: ${{ inputs.dir }}
      env:
        COMPONENTS: ${{ inputs.components }}
      run: |
        file="$PWD/rust-toolchain.toml"
        if [ ! -f "$file" ]; then
          echo "::error::no rust-toolchain.toml in $PWD"
          exit 1
        fi
        channels=$(sed -n -E "s/^[[:space:]]*channel[[:space:]]*=[[:space:]]*[\"']([^\"']+)[\"'].*/\1/p" "$file")
        count=$(printf '%s' "$channels" | grep -c . || true)
        if [ "$count" -ne 1 ]; then
          echo "::error file=$file::$file needs exactly one channel = \"...\" line, it has $count"
          exit 1
        fi
        channel=$channels
        install=(rustup toolchain install "$channel" --profile minimal)
        if [ -n "${COMPONENTS//[[:space:],]/}" ]; then
          install+=(--component "$COMPONENTS")
        fi
        "${install[@]}"
        echo "PINNED_CHANNEL=$channel" >> "$GITHUB_ENV"
    - name: Check that cargo uses it
      shell: bash
      working-directory: ${{ inputs.dir }}
      run: |
        active=$(rustup show active-toolchain)
        used=$(rustc --version)
        pinned=$(rustup run "$PINNED_CHANNEL" rustc --version)
        echo "$active"
        echo "$used"
        cargo --version
        case "$active" in
          "$PINNED_CHANNEL-"*) ;;
          *) echo "::error::active toolchain is not the pinned $PINNED_CHANNEL: $active"; exit 1 ;;
        esac
        if [ "$used" != "$pinned" ]; then
          echo "::error::rustc is $used, the pinned $PINNED_CHANNEL is $pinned"
          exit 1
        fi
        escaped=${PINNED_CHANNEL//./\\.}
        case "$PINNED_CHANNEL" in
          stable) pattern='^rustc [0-9]+\.[0-9]+\.[0-9]+ \(' ;;
          beta*) pattern='^rustc [0-9]+\.[0-9]+\.[0-9]+-beta' ;;
          nightly*) pattern='^rustc [0-9]+\.[0-9]+\.[0-9]+-nightly \([0-9a-f]+ [0-9]{4}-[0-9]{2}-[0-9]{2}\)$' ;;
          [0-9]*.[0-9]*.[0-9]*) pattern="^rustc $escaped " ;;
          [0-9]*.[0-9]*) pattern="^rustc $escaped\.[0-9]+ " ;;
          *) echo "::error::unknown channel $PINNED_CHANNEL"; exit 1 ;;
        esac
        if ! [[ "$used" =~ $pattern ]]; then
          echo "::error::$used does not match the channel $PINNED_CHANNEL"
          exit 1
        fi
