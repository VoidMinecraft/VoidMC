name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  ci-ok:
    name: ci-ok
    if: always()
    needs: [fmt, clippy, test]
    runs-on: ubuntu-latest
    steps:
      - name: Every required job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'length > 0 and all(.[]; .result == "success")' > /dev/null

  clippy-beta:
    name: clippy on beta (report only)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      RUSTUP_TOOLCHAIN: beta
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install beta --profile minimal --component clippy
      - name: Clippy on beta
        run: |
          rustc --version
          status=0
          cargo clippy --workspace --all-targets --all-features --message-format=short > clippy-beta.txt 2>&1 || status=$?
          {
            echo "## Clippy on $(rustc --version)"
            echo
            echo "$(grep -c ': warning' clippy-beta.txt || true) warning(s), $(grep -c ': error' clippy-beta.txt || true) error(s)."
            echo
            echo '```text'
            grep -E ': (warning|error)' clippy-beta.txt | sed -E 's/^[^ ]+: //' | sort | uniq -c | sort -rn | head -50 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage
        run: |
          mkdir -p target/coverage
          cargo llvm-cov clean --workspace
          cargo llvm-cov --workspace --all-features --no-report
          cargo llvm-cov report --summary-only | tee target/coverage/summary.txt
          cargo llvm-cov report --lcov --output-path target/coverage/lcov.info

      - name: Add coverage summary
        run: |
          {
            echo "## Code coverage"
            echo
            echo "Full text and LCOV reports are available in the \`coverage-report\` artifact."
            echo
            echo '```text'
            grep '^TOTAL' target/coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            target/coverage/summary.txt
            target/coverage/lcov.info
          if-no-files-found: error
