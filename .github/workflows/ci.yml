name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  changes:
    name: code changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          filter: blob:none
      - id: diff
        env:
          DOCS_ONLY: '^(void-docs/|docs/|greenlight-review/)|\.(md|pdf|typst)$'
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only HEAD^1 HEAD > changed.txt
          cat changed.txt
          if grep -qvE "$DOCS_ONLY" changed.txt; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only documentation changed: the Rust jobs are skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  fmt:
    name: rustfmt
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --all-features

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, fmt, clippy, test]
    runs-on: ubuntu-latest
    steps:
      - name: Every required job succeeded, or was skipped for a documentation-only change
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e '
            {"true": "success", "false": "skipped"}[.changes.outputs.code // ""] as $expected
            | (keys | sort) == ["changes", "clippy", "fmt", "test"]
              and .changes.result == "success"
              and $expected != null
              and all(.fmt, .clippy, .test; .result == $expected)' > /dev/null

  coverage:
    name: coverage
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage
        run: |
          mkdir -p target/coverage
          cargo llvm-cov clean --workspace
          cargo llvm-cov --workspace --all-features --no-report
          cargo llvm-cov report --summary-only | tee target/coverage/summary.txt
          cargo llvm-cov report --lcov --output-path target/coverage/lcov.info

      - name: Add coverage summary
        run: |
          {
            echo "## Code coverage"
            echo
            echo "Full text and LCOV reports are available in the \`coverage-report\` artifact."
            echo
            echo '```text'
            grep '^TOTAL' target/coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            target/coverage/summary.txt
            target/coverage/lcov.info
          if-no-files-found: error
