name: Stacked

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: ["**"]

concurrency:
  group: stacked-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  stacked:
    name: stacked on its base
    if: >-
      (github.event_name == 'pull_request' && github.base_ref != github.event.repository.default_branch)
      || (github.event_name == 'push' && github.ref_name != github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Each pull request contains the head of its base
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE: ${{ github.base_ref }}
          PUSHED: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base=$PR_BASE
            numbers=$PR_NUMBER
          else
            base=$PUSHED
            numbers=$(gh pr list --repo "$GITHUB_REPOSITORY" --base "$base" --state open --limit 200 --json number --jq '.[].number')
          fi
          if [ -z "$numbers" ]; then
            echo "no open pull request on $base"
            exit 0
          fi
          git fetch --no-tags origin "+refs/heads/$base:refs/remotes/origin/$base"
          failed=0
          for number in $numbers; do
            git fetch --no-tags origin "+refs/pull/$number/head:refs/remotes/pull/$number"
            if git merge-base --is-ancestor "origin/$base" "refs/remotes/pull/$number"; then
              echo "#$number contains the head of $base"
            else
              echo "::error::#$number lacks commits of $base: rebase it on $base"
              failed=1
            fi
          done
          exit "$failed"
