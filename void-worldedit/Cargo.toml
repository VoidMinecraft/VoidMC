[package]
name = "voidmc-worldedit"
edition = "2024"
description = "In-game world editing for VoidMC: selections, patterns, masks, undo, clipboard, schematics and brushes."
version = "0.1.0"
license.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true
keywords.workspace = true

[features]
default = ["engine"]
engine = ["dep:voidmc", "dep:voidmc-protocol", "dep:bevy_ecs", "dep:bevy_app", "dep:uuid"]

[dependencies]
voidmc-data = { version = "0.1.2", path = "../void-data" }
ussr-nbt = "0.2.1"
flate2 = "1"
tracing = "0.1.44"
voidmc = { version = "0.2.0", path = "../void", optional = true }
voidmc-protocol = { version = "0.3.0", path = "../void-protocol", optional = true }
bevy_ecs = { version = "0.18.0", optional = true }
bevy_app = { version = "0.18.0", optional = true }
uuid = { version = "1.16.0", features = ["v4"], optional = true }

[dev-dependencies]
criterion = "0.7"
flume = "0.12.0"
tempfile = "3"

[[bench]]
name = "edits"
harness = false
