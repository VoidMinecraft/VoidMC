[package]
name = "voidmc-ui"
version = "0.1.0"
edition = "2024"
publish = false
description = "Vanilla client UI for VoidMC: dialogs, clickable glyph grids and generated resource packs"
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
voidmc = { version = "0.2.0", path = "../void" }
voidmc-protocol = { version = "0.3.0", path = "../void-protocol" }
bevy_app = "0.18.0"
bevy_ecs = "0.18.0"
png = "0.18"
serde_json = "1.0"
sha1 = "0.11"
tracing = "0.1.44"
ussr-nbt = "0.2.1"
uuid = "1.16.0"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
flume = "0.12.0"
