[package]
name = "voidmc-map"
version = "0.1.0"
edition = "2024"
publish = false
description = "Server map POC: a block model of the world, explored with the crosshair"
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
voidmc = { version = "0.2.0", path = "../void" }
voidmc-codec = { version = "0.1.1", path = "../void-codec" }
voidmc-data = { version = "0.1.2", path = "../void-data" }
voidmc-protocol = { version = "0.3.0", path = "../void-protocol" }
voidmc-ui = { version = "0.1.0", path = "../void-ui" }
bevy_app = "0.18.0"
bevy_ecs = "0.18.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
ussr-nbt = "0.2.1"
uuid = "1.16.0"

[features]
# Logs where the time of a slow tick goes, system by system.
profile = ["bevy_ecs/trace", "bevy_ecs/debug"]
packet-trace = ["voidmc/packet-trace"]
seeded-uuids = ["voidmc/seeded-uuids"]

[dev-dependencies]
flume = "0.12.0"
