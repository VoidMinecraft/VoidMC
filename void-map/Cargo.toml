[package]
name = "voidmc-map"
version = "0.1.0"
edition = "2024"
publish = false
description = "Server map POC: terrain from above in a vanilla dialog, moved by clicks, with markers"
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
voidmc = { version = "0.2.0", path = "../void" }
voidmc-ui = { version = "0.1.0", path = "../void-ui" }
bevy_app = "0.18.0"
bevy_ecs = "0.18.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }

[dev-dependencies]
flume = "0.12.0"
voidmc-codec = { version = "0.1.1", path = "../void-codec" }
voidmc-protocol = { version = "0.3.0", path = "../void-protocol" }
