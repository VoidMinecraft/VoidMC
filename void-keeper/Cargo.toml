[package]
name = "voidmc-keeper"
version = "0.1.0"
edition = "2024"
publish = false
description = "Development proxy: keeps a vanilla client in game while the server restarts or crashes."
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
bytes = "1"
flate2 = "1"
serde_json = "1.0"
tokio = { version = "1.44.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
ussr-nbt = "0.2.1"
uuid = "1.16.0"
voidmc-codec = { version = "0.1.1", path = "../void-codec" }
voidmc-data = { version = "0.1.2", path = "../void-data" }
voidmc-protocol = { version = "0.3.0", path = "../void-protocol" }
