[package]
name = "voidmc-codec"
edition = "2021"
description = "Encode/decode primitives for the Minecraft network protocol used by VoidMC."
version = "0.1.1"
license.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true
keywords.workspace = true

[dependencies]
voidmc-codec-macros = { version = "0.1.1", path = "../void-codec-macros" }
uuid = { version = "1.16.0", features = ["v4"] }
ussr-nbt = "0.2.1"
tracing = "0.1.44"

[dev-dependencies]
criterion = "0.7"
proptest = "1.8"

[[bench]]
name = "codec_comparison"
harness = false

[[bench]]
name = "decode_paths"
harness = false

[[bench]]
name = "nbt_encode"
harness = false
