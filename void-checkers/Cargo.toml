[package]
name = "voidmc-checkers"
version = "0.1.0"
edition = "2024"
publish = false
description = "Checkers POC: a 2.5D board drawn as clickable text in a vanilla dialog"
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
voidmc = { version = "0.2.0", path = "../void" }
voidmc-ui = { version = "0.1.0", path = "../void-ui" }
bevy_app = "0.18.0"
bevy_ecs = "0.18.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }

[dev-dependencies]
flume = "0.12.0"
