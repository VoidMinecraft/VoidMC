[package]
name = "voidmc"
edition = "2024"
description = "Modular, ECS-driven Minecraft server framework written in Rust."
version = "0.2.0"
license.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true
keywords.workspace = true

[dependencies]
tokio = { version = "1.44.1", features = ["full"] }
voidmc-net = { version = "0.1.1", path = "../void-net" }
voidmc-codec = { version = "0.1.1", path = "../void-codec" }
voidmc-protocol = { version = "0.3.0", path = "../void-protocol" }
voidmc-data = { version = "0.1.2", path = "../void-data" }
uuid = { version = "1.16.0", features = ["v4"] }
ussr-nbt = "0.2.1"
tracing = "0.1.44"
bevy_ecs = "0.18.0"
bevy_app = "0.18.0"
bevy_platform = "0.18.0"
flume = "0.12.0"
rand = "0.8"
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
tracing-subscriber = { version = "0.3.22", default-features = false, features = ["registry", "std"], optional = true }

[features]
# Writes one JSON line per packet to the file named by `VOID_TRACE`.
packet-trace = ["bevy_ecs/debug", "bevy_ecs/trace", "dep:serde", "dep:serde_json", "dep:tracing-subscriber"]

[dev-dependencies]
criterion = "0.7"
log = "0.4"

[[bench]]
name = "channel_handoff"
harness = false

[[bench]]
name = "players_send"
harness = false
